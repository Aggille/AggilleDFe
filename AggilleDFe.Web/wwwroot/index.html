<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AggilleDFe</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="ag-splash">
        <img src="images/background.png" alt="Aggille" />
        <svg class="ag-spinner" width="40" height="40" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="18" stroke="#D98C90" stroke-width="4" fill="none"
                    stroke-dasharray="75 30" stroke-linecap="round" />
        </svg>
        <span class="ag-splash-text">Carregando...</span>
    </div>
    <style>
        #ag-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            background: #fff;
        }

        #ag-splash img {
            width: 260px;
            max-width: 70vw;
        }

        .ag-spinner {
            animation: ag-spin 0.9s linear infinite;
        }

        @keyframes ag-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ag-splash-text {
            font-family: Roboto, Arial, sans-serif;
            font-size: 12px;
            letter-spacing: .6px;
            opacity: .55;
        }
    </style>
    <script>
        (function () {
            function fadeSplash() {
                var s = document.getElementById('ag-splash');
                if (!s) return;
                s.style.transition = 'opacity 0.4s ease';
                s.style.opacity = '0';
                setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
            }

            var app = document.getElementById('app');
            if (!app) { setTimeout(fadeSplash, 4000); return; }

            var observer = new MutationObserver(function () {
                if (app.childNodes.length > 0) {
                    observer.disconnect();
                    fadeSplash();
                }
            });
            observer.observe(app, { childList: true });

            setTimeout(fadeSplash, 30000);
        })();
    </script>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/downloadFileFromStream.js"></script>
    <script src="js/pdfViewer.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
