server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do container - resolver "api" em tempo de requisicao (via
    # variavel) evita que o nginx falhe ao subir se o container da API ainda
    # nao existir, e acompanha troca de IP quando o container e recriado.
    # __RESOLVER__ e trocado pelo entrypoint.sh pelo nameserver real do
    # /etc/resolv.conf (127.0.0.11 no Docker, IP do gateway no Podman).
    resolver __RESOLVER__ valid=30s ipv6=off;

    # Proxy reverso pra API: o Blazor WASM chama /api/... na MESMA origem em
    # que a pagina foi carregada (localhost, IP da rede, IP externo ou
    # dominio), sem depender de uma URL fixa da API nem de CORS.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Download/importacao/exportacao de XMLs podem levar varios minutos
        # (o Web usa timeout de ate 30 min nessas telas).
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
    }

    gzip_static on;
}
