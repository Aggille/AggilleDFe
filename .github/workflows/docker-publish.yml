name: Build e publica imagens Docker (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # nomes de imagem no GHCR precisam ser minusculos - nao usar
  # github.repository_owner direto (preserva "Aggille" com maiuscula)
  IMAGE_NAMESPACE: aggille/aggilledfe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Sem isso, quando um servico falha os outros aparecem como
      # "cancelled" em vez de rodar ate o fim - dificulta ver se so um
      # Dockerfile tem problema ou se e algo comum aos tres.
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: AggilleDFe.API/Dockerfile
          - service: worker
            dockerfile: AggilleDFe.Worker/Dockerfile
          - service: web
            dockerfile: AggilleDFe.Web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # O driver "docker" padrao (sem builder Buildx configurado) nao
          # suporta atestacao de proveniencia/SBOM, que o build-push-action
          # v6 tenta gerar por padrao ao dar push - isso fazia o push falhar
          # silenciosamente mesmo com o build em si correto. O setup-buildx
          # acima ja resolveria sozinho, mas desligar aqui tambem deixa
          # explicito que nao precisamos dessas atestacoes.
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:${{ github.sha }}
